[project]
name = "aitk"
version = "0.1.0"
description = "AI Toolkit CLI"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.3",
    "httpx>=0.28.0",
    "openai>=2.0.0",
    "pillow>=12.3.0",
    "firecrawl-py>=4.0.0",
    "playwright>=1.50.0",
    "imageio[pyav]>=2.37.0",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
ocr = ["pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'"]

[project.scripts]
aitk = "aitk:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aitk"]

[tool.ruff]
line-length = 100
target-version = "py312"
